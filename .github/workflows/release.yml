name: Release

# Build the upstream onnxruntime release for CUDA 13 with the datacenter Blackwell architectures
# (sm_100 for B200, sm_103 for B300), which no published onnxruntime-gpu carries: the -cu130
# inference images of gladiaio/gladia-enterprise run their ONNX add-ons on those GPUs with it
# (#3621). Same sources, same tag: only CMAKE_CUDA_ARCHITECTURES changes. See README.md.
on:
  schedule:
    - cron: "41 0 * * *"  # 00:41 UTC: plan PyPI's latest release, build it if it is not released
  workflow_dispatch:
    inputs:
      version:
        description: upstream onnxruntime version to build (default PyPI's latest release), e.g. 1.31.1
        required: false
      force:
        description: rebuild and replace the release when it exists
        type: boolean
        default: false
      dry_run:
        description: build and check, publish nothing (even when released)
        type: boolean
        default: false

# bash -eo pipefail: a failed script piped into tee fails its step
defaults:
  run:
    shell: bash

permissions:
  contents: write

env:
  REV: "1"                       # bump when gladia/ changes: rebuilds the current upstream release
  IMAGE: nvidia/cuda:13.0.3-cudnn-devel-ubuntu24.04
  ARCHS: 75-real;80-real;86-real;89-real;90a-real;100-real;103-real;120a-real
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      local_version: ${{ steps.plan.outputs.local_version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force || inputs.dry_run }}
        run: bash gladia/plan.sh "${VERSION}" "${REV}" "${FORCE:-false}" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.plan.outputs.local_version }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MAX_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: gladia-src
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/onnxruntime
          ref: v${{ needs.plan.outputs.version }}
          submodules: recursive
          path: src
      # the CUDA devel image and the build tree need ~40 GB: drop the runner's preinstalled toolchains
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /opt/microsoft /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h /
      # 16 GB of RAM: ORT's CUDA provider compiles many translation units at once and nvcc takes
      # several GB; 4 jobs and a swap file absorb the peaks (a 64-core host with 200 GB took 1 h 25)
      - name: Swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -g
      # ccache across runs: a REV bump, or a build of another upstream release, recompiles only what
      # changed (the first build of a release is cold: 6 h is the job's ceiling, a cold build fits)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ccache
          key: ccache-cu130-${{ needs.plan.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            ccache-cu130-${{ needs.plan.outputs.version }}-
            ccache-cu130-
      - name: Build the wheel
        run: |
          mkdir -p dist ccache
          start=$SECONDS
          docker run --rm -e VERSION -e REV -e MAX_JOBS -e ARCHS -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE=8G -v "$PWD/src:/src" -v "$PWD/dist:/out" -v "$PWD/ccache:/ccache" \
            -v "$PWD/gladia-src/gladia:/gladia:ro" \
            "$IMAGE" bash /gladia/build.sh "$VERSION" "$REV" /out
          echo "built in $(( (SECONDS - start) / 60 )) min"
          sudo chown -R "$(id -u)" dist ccache
      - name: Check the wheel
        run: |
          # the file name, the METADATA version and the SASS of every architecture, sm_100a / sm_103a
          # included (cuobjdump of the toolkit)
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/gladia-src/gladia:/gladia:ro" "$IMAGE" \
            bash -c 'apt-get update -qq &&
              apt-get install -y -qq --no-install-recommends python3 >/dev/null &&
              python3 /gladia/check_wheel.py /dist/*.whl --version "$0" --rev "$1" --archs "$2"' \
            "$VERSION" "$REV" "$ARCHS"
          # it installs on the CUDA 13 torch of the -cu130 images and imports (no GPU here)
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install -q "onnxruntime-gpu @ file://$PWD/$(ls dist/*.whl)"
          /tmp/v/bin/python -c "import importlib.metadata as m, onnxruntime; v = m.version('onnxruntime-gpu'); print('onnxruntime-gpu', v, 'available', onnxruntime.get_available_providers()); assert v == '${{ needs.plan.outputs.local_version }}'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-cu130
          path: dist/*.whl
          compression-level: 0

  release:
    name: Scan and release
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # the build provenance attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # Trivy is a release binary checked against its sha256 (the aquasecurity/trivy-action tags were
      # hijacked in 2026-03), as gladia-enterprise's .github/actions/trivy-scan does
      - name: Trivy gate (fixable HIGH / CRITICAL)
        run: |
          curl -fsSL --proto '=https' --retry 3 -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          for whl in dist/*.whl; do
            d="unpacked/$(basename "$whl" .whl)"
            mkdir -p "$d" && python3 -m zipfile -e "$whl" "$d"
          done
          /tmp/trivy rootfs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 unpacked
      # signed SLSA build provenance of the wheel: this workflow, this commit, this run. Consumers
      # check it before pinning (gh attestation verify <wheel> -R gladiaio/onnxruntime
      # --signer-workflow gladiaio/onnxruntime/.github/workflows/release.yml)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          LOCAL: ${{ needs.plan.outputs.local_version }}
        run: |
          (cd dist && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS)
          jq -n --arg upstream "$VERSION" --arg local_version "$LOCAL" --arg cuda "$(echo "$IMAGE" | sed 's|nvidia/cuda:\([0-9.]*\)-.*|\1|')" \
            --arg archs "$ARCHS" --arg recipe "${GITHUB_SHA}" \
            '$ARGS.named + {sass: ["sm_75","sm_80","sm_86","sm_89","sm_90a","sm_100a","sm_103a","sm_120a"], ptx: []}' \
            > dist/build.json
          cat dist/build.json
          notes="onnxruntime-gpu ${VERSION} (upstream tag v${VERSION}, unchanged sources) built for CUDA 13 by gladia/build.sh at ${GITHUB_SHA::8}, with the SASS of PyPI's wheel plus sm_100a (B200) and sm_103a (B300): compute capabilities ${ARCHS}. Package version ${LOCAL}. Used by gladiaio/gladia-enterprise's -cu130 inference images (#3621)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl dist/SHA256SUMS dist/build.json --clobber
          else
            gh release create "$TAG" dist/*.whl dist/SHA256SUMS dist/build.json --target "$GITHUB_SHA" \
              --title "$TAG" --notes "$notes"
          fi
